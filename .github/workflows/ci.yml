name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: aws-actions/setup-sam@v2
      - name: Install project and CI-only security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pip-audit>=2.7,<3" "bandit>=1.7,<2"
          python -m pip check
      - name: Validate SAM package guardrails
        run: |
          python infra/scripts/validate_template.py
          sam validate --template-file infra/template.yaml
      - name: Build Lambda artifacts in the target runtime container
        if: matrix.python-version == '3.13'
        run: sam build -t infra/template.yaml --use-container
      - name: Run tests
        run: python -m pytest -q
      - name: Type check
        run: python -m mypy src/proofloop tests
      - name: Lint
        run: python -m ruff check src tests
      - name: Compile source
        run: |
          python -m compileall -q src tests scripts infra/scripts
          python -c "from proofloop.infrastructure.lambda_handler import handler; from proofloop.infrastructure.scheduled_handler import scheduled_handler"
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard/app.js
      - name: Import both handlers from SAM build artifacts
        if: matrix.python-version == '3.13'
        run: |
          python infra/scripts/verify_built_handlers.py \
            .aws-sam/build/ProofLoopApiFunction proofloop.infrastructure.lambda_handler:handler \
            .aws-sam/build/ProofLoopScheduledFunction proofloop.infrastructure.scheduled_handler:scheduled_handler
      - name: Audit installed dependencies
        run: python -m pip_audit --strict --progress-spinner off
      - name: Scan Python source for common security issues
        run: python -m bandit -q -r src/proofloop

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  ProofLoop's budget-conscious, serverless runtime evidence assurance slice.

Parameters:
  ApiKey:
    Type: String
    NoEcho: true
    Description: Required application API key. Supply securely at deployment; never commit a value.
  AllowedOrigin:
    Type: String
    AllowedPattern: '^https?://[^*\s]+$'
    ConstraintDescription: Must be one explicit HTTP(S) origin without a wildcard.
    Description: Required exact browser origin allowed by the ProofLoop API.
  AssuranceBoundaryId:
    Type: String
    AllowedPattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    ConstraintDescription: Must be one explicit lowercase assurance-boundary id (letters, digits, single hyphens) with no wildcard or blank value.
    Description: Required exact assurance boundary this deployment is authorized to certify. No default, so a deployment can never silently certify the wrong customer boundary.
  EnableReconciliationSchedule:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable only through a reviewed post-smoke stack update.
  AlarmNotificationEmail:
    Type: String
    NoEcho: true
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Must be one valid notification email address.
    Description: Required email endpoint for development alarm notifications.
  BedrockModelId:
    Type: String
    Description: Required Bedrock model or inference-profile identifier for invoice extraction.
  BedrockModelArn:
    Type: String
    AllowedPattern: "^arn:[A-Za-z0-9-]+:bedrock:[A-Za-z0-9-]*:[0-9]*:.+$"
    Description: Exact model or inference-profile ARN allowed by the API Lambda role.
  BedrockRegion:
    Type: String
    AllowedPattern: "^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$"
    Description: AWS region used to construct the injected Bedrock Runtime client.
  MaxModelCalls:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: Hard maximum structured model calls per invoice run.
  MaxModelRetries:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 9
    Description: Maximum model retries, still bounded by MaxModelCalls.
  MaxOutputTokens:
    Type: Number
    Default: 2000
    MinValue: 1
    MaxValue: 2000
    Description: Hard maximum generated tokens requested per model call.
  ModelTimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 40
    Description: Per-request model timeout budget in seconds.

Conditions:
  ReconciliationScheduleEnabled: !Equals
    - !Ref EnableReconciliationSchedule
    - "true"

Resources:
  ProofLoopEvidenceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: AgentRegistryIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: ProofLoop
        - Key: DataClass
          Value: EvidenceMetadata

  ProofLoopApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-proofloop-api"
      RetentionInDays: 30

  ProofLoopScheduledLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-proofloop-reconciliation"
      RetentionInDays: 30

  ProofLoopHttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-proofloop"
      RetentionInDays: 30

  ProofLoopHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      AccessLogSettings:
        DestinationArn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AWS::StackName}-proofloop:*"
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime","httpMethod":"$context.httpMethod",
          "routeKey":"$context.routeKey","status":"$context.status",
          "responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}

  ProofLoopAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: Service
          Value: ProofLoop

  ProofLoopAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmNotificationEmail
      TopicArn: !Ref ProofLoopAlarmTopic

  ProofLoopApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    DependsOn:
      - ProofLoopApiLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-proofloop-api"
      CodeUri: ../
      Handler: proofloop.infrastructure.lambda_handler.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 45
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          PROOFLOOP_API_KEY: !Ref ApiKey
          PROOFLOOP_ALLOWED_ORIGIN: !Ref AllowedOrigin
          PROOFLOOP_EVIDENCE_TABLE_NAME: !Ref ProofLoopEvidenceTable
          PROOFLOOP_LOG_LEVEL: INFO
          PROOFLOOP_SEED_DEMO: "false"
          PROOFLOOP_MODEL_PROVIDER: bedrock
          PROOFLOOP_BEDROCK_MODEL_ID: !Ref BedrockModelId
          PROOFLOOP_BEDROCK_REGION: !Ref BedrockRegion
          PROOFLOOP_MODEL_VERSION: !Ref BedrockModelId
          PROOFLOOP_MAX_MODEL_CALLS: !Ref MaxModelCalls
          PROOFLOOP_MAX_RETRIES: !Ref MaxModelRetries
          PROOFLOOP_MAX_OUTPUT_TOKENS: !Ref MaxOutputTokens
          PROOFLOOP_MODEL_TIMEOUT_SECONDS: !Ref ModelTimeoutSeconds
          PROOFLOOP_SEED_SAFE_CANARY: "true"
          PROOFLOOP_DEMO_ENVIRONMENT: DEVELOPMENT
          PROOFLOOP_DEMO_BOUNDARY_ID: !Ref AssuranceBoundaryId
          POWERTOOLS_SERVICE_NAME: proofloop-api
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
                - dynamodb:UpdateItem
              Resource: !GetAtt ProofLoopEvidenceTable.Arn
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-proofloop-api:*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Ref BedrockModelArn
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProofLoopHttpApi
            Path: /{proxy+}
            Method: ANY

  ProofLoopScheduledFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    DependsOn:
      - ProofLoopScheduledLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-proofloop-reconciliation"
      CodeUri: ../
      Handler: proofloop.infrastructure.scheduled_handler.scheduled_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          PROOFLOOP_EVIDENCE_TABLE_NAME: !Ref ProofLoopEvidenceTable
          PROOFLOOP_LOG_LEVEL: INFO
          PROOFLOOP_SEED_DEMO: "false"
          PROOFLOOP_MODEL_VERSION: !Ref BedrockModelId
          PROOFLOOP_SEED_SAFE_CANARY: "true"
          PROOFLOOP_DEMO_ENVIRONMENT: DEVELOPMENT
          PROOFLOOP_DEMO_BOUNDARY_ID: !Ref AssuranceBoundaryId
          POWERTOOLS_SERVICE_NAME: proofloop-reconciliation
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 300
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
                - dynamodb:UpdateItem
              Resource: !GetAtt ProofLoopEvidenceTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub "${ProofLoopEvidenceTable.Arn}/index/AgentRegistryIndex"
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-proofloop-reconciliation:*"
      Events:
        FiveMinuteReconciliation:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: !If [ReconciliationScheduleEnabled, true, false]
            Input: '{"source":"proofloop.reconciliation"}'
            RetryPolicy:
              MaximumEventAgeInSeconds: 300
              MaximumRetryAttempts: 2
            DeadLetterConfig:
              Type: SQS
              QueueLogicalId: ProofLoopScheduledDeadLetterQueue

  ProofLoopApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ProofLoop API Lambda reported an error.
      ActionsEnabled: true
      AlarmActions:
        - !Ref ProofLoopAlarmTopic
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProofLoopApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProofLoopApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ProofLoop API Lambda reported a throttle.
      ActionsEnabled: true
      AlarmActions:
        - !Ref ProofLoopAlarmTopic
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProofLoopApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProofLoopScheduledErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ProofLoop scheduled Lambda reported an error.
      ActionsEnabled: true
      AlarmActions:
        - !Ref ProofLoopAlarmTopic
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProofLoopScheduledFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProofLoopScheduledThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ProofLoop scheduled Lambda reported a throttle.
      ActionsEnabled: true
      AlarmActions:
        - !Ref ProofLoopAlarmTopic
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProofLoopScheduledFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProofLoopEventBridgeDeliveryDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ProofLoop EventBridge delivery DLQ has a visible message.
      ActionsEnabled: true
      AlarmActions:
        - !Ref ProofLoopAlarmTopic
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ProofLoopScheduledDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProofLoopLambdaFailureDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ProofLoop Lambda asynchronous failure DLQ has a visible message.
      ActionsEnabled: true
      AlarmActions:
        - !Ref ProofLoopAlarmTopic
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ProofLoopScheduledFunctionEventInvokeConfigOnFailureQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProofLoopEventBridgeFailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ProofLoop EventBridge rule permanently failed an invocation.
      ActionsEnabled: true
      AlarmActions:
        - !Ref ProofLoopAlarmTopic
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref ProofLoopScheduledFunctionFiveMinuteReconciliation
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProofLoopHttpApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ProofLoop HTTP API reported a server error.
      ActionsEnabled: true
      AlarmActions:
        - !Ref ProofLoopAlarmTopic
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ProofLoopHttpApi
        - Name: Stage
          Value: "$default"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProofLoopDynamoDbReadThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ProofLoop DynamoDB table reported a read throttle.
      ActionsEnabled: true
      AlarmActions:
        - !Ref ProofLoopAlarmTopic
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref ProofLoopEvidenceTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProofLoopDynamoDbWriteThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ProofLoop DynamoDB table reported a write throttle.
      ActionsEnabled: true
      AlarmActions:
        - !Ref ProofLoopAlarmTopic
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref ProofLoopEvidenceTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  HttpApiUrl:
    Description: ProofLoop HTTP API base URL.
    Value: !Sub "https://${ProofLoopHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/"
  EvidenceTableName:
    Description: DynamoDB evidence table name.
    Value: !Ref ProofLoopEvidenceTable
  EvidenceTableArn:
    Description: DynamoDB evidence table ARN.
    Value: !GetAtt ProofLoopEvidenceTable.Arn
  ApiLogGroupName:
    Description: API Lambda CloudWatch log group name.
    Value: !Ref ProofLoopApiLogGroup
  ScheduledLogGroupName:
    Description: Scheduled Lambda CloudWatch log group name.
    Value: !Ref ProofLoopScheduledLogGroup
